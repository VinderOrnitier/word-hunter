name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts: pnpm 11.x errors hard (ERR_PNPM_IGNORED_BUILDS) on
        # unapproved postinstall scripts, and neither `pnpm-workspace.yaml`
        # `ignoredBuiltDependencies` nor `.npmrc` `ignored-built-dependencies[]`
        # bypass that gate on a clean CI install. The only postinstall in our
        # tree (unrs-resolver) is just a binary verifier — the actual native
        # module ships via optionalDependencies, which pnpm picks via
        # os/cpu. Skipping all scripts is safe here.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
