<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"><style>
body { height: 240px; padding: 24px 28px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.line { display: flex; align-items: baseline; gap: 16px; }
.line .meta { font-family: var(--wh-font-mono); font-size: 10px; color: var(--wh-fg-3); width: 130px; flex-shrink: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.chip { font-family: var(--wh-font-mono); font-size: 13px; padding: 4px 10px; background: var(--wh-surface); border: 1px solid var(--wh-border); border-radius: var(--wh-radius-1); color: var(--wh-fg); }
</style></head><body>
  <div class="label-eyebrow">Mono · the word itself</div>
  <div class="stack">
    <div class="line"><span class="meta">word-display · 28/700</span><span class="wh-word-display">Pikachu</span></div>
    <div class="line"><span class="meta">word · 16/500</span><span class="wh-word">flamingo</span></div>
    <div class="line"><span class="meta">list chips</span>
      <div class="row">
        <span class="chip">cat</span><span class="chip">elephant</span><span class="chip">fox</span><span class="chip">hedgehog</span><span class="chip">crocodile</span>
      </div>
    </div>
  </div>
</body></html>
