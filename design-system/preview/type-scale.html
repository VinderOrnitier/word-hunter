<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"><style>
body { height: 240px; padding: 24px 28px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.line { display: flex; align-items: baseline; gap: 16px; }
.line .meta { font-family: var(--wh-font-mono); font-size: 10px; color: var(--wh-fg-3); width: 130px; flex-shrink: 0; }
</style></head><body>
  <div class="label-eyebrow">Body, meta & eyebrow</div>
  <div class="stack">
    <div class="line"><span class="meta">body · 14/400</span><span class="wh-body">The word is hidden in a paragraph somewhere on this page.</span></div>
    <div class="line"><span class="meta">body-sm · 12/400</span><span class="wh-body-sm">50 + words required to qualify as a paragraph.</span></div>
    <div class="line"><span class="meta">meta · 11/500</span><span class="wh-meta">Found 2 minutes ago · no hint</span></div>
    <div class="line"><span class="meta">eyebrow · 11/600 caps</span><span class="wh-eyebrow">Active word</span></div>
    <div class="line"><span class="meta">link / inline</span><span style="font-family: var(--wh-font-sans); font-size: 14px; color: var(--wh-hint); text-decoration: underline; text-decoration-color: var(--wh-hint-soft); text-underline-offset: 3px">en.wikipedia.org/wiki/Otter</span></div>
  </div>
</body></html>
