<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"><style>
body { height: 200px; }
.swatch .chip { height: 88px; display: flex; align-items: end; padding: 10px; }
.sample { font-family: var(--wh-font-sans); font-weight: 600; font-size: 14px; letter-spacing: 0; }
</style></head><body>
  <div class="label-eyebrow">Foreground · text on dark</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background: var(--wh-surface)"><span class="sample" style="color: var(--wh-fg)">fg primary</span></div><span class="name">fg</span><span class="val">#E8ECF6</span></div>
    <div class="swatch"><div class="chip" style="background: var(--wh-surface)"><span class="sample" style="color: var(--wh-fg-2)">fg secondary</span></div><span class="name">fg-2</span><span class="val">#B6BED4</span></div>
    <div class="swatch"><div class="chip" style="background: var(--wh-surface)"><span class="sample" style="color: var(--wh-fg-3)">fg meta</span></div><span class="name">fg-3</span><span class="val">#8C95B0</span></div>
    <div class="swatch"><div class="chip" style="background: var(--wh-surface)"><span class="sample" style="color: var(--wh-fg-4)">disabled</span></div><span class="name">fg-4</span><span class="val">#5C6480</span></div>
    <div class="swatch"><div class="chip" style="background: var(--wh-primary)"><span class="sample" style="color: var(--wh-on-primary)">on primary</span></div><span class="name">on-primary</span><span class="val">#1A1405</span></div>
  </div>
</body></html>
