<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"><style>
body { height: 200px; }
.swatch .chip { height: 88px; }
</style></head><body>
  <div class="label-eyebrow">Surfaces · dark default</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background: var(--wh-bg)"></div><span class="name">bg</span><span class="val">#0B0F19</span></div>
    <div class="swatch"><div class="chip" style="background: var(--wh-surface)"></div><span class="name">surface</span><span class="val">#151B2C</span></div>
    <div class="swatch"><div class="chip" style="background: var(--wh-surface-2)"></div><span class="name">surface-2</span><span class="val">#1F2740</span></div>
    <div class="swatch"><div class="chip" style="background: var(--wh-surface-3)"></div><span class="name">surface-3</span><span class="val">#2A334D</span></div>
    <div class="swatch"><div class="chip" style="background: var(--wh-border); border-color: transparent"></div><span class="name">border</span><span class="val">#2A334D</span></div>
    <div class="swatch"><div class="chip" style="background: var(--wh-border-soft); border-color: transparent"></div><span class="name">border-soft</span><span class="val">#1C2238</span></div>
  </div>
</body></html>
